{% extends "base.html" %}
{% block title %}System Settings — SmartAttend{% endblock %}
{% block breadcrumb %}
    <a href="{{ url_for('admin.dashboard') }}">Dashboard</a> / <span>Settings</span>
{% endblock %}

{% block content %}
<div style="max-width: 600px;">
    <div class="card">
        <h3>⚙️ Global Settings</h3>
        <form method="POST" action="{{ url_for('admin.settings') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label>Institution Name</label>
                <input type="text" name="institution_name" value="{{ settings.get('institution_name', '') }}" required>
            </div>
            
            <div class="form-group">
                <label>Required Attendance Threshold (Decimal, e.g. 0.75 for 75%)</label>
                <input type="number" step="0.01" min="0" max="1" name="required_attendance_percent" value="{{ settings.get('required_attendance_percent', '0.75') }}" required>
            </div>
            
            <div class="form-group">
                <label>Warning Band (Decimal, e.g. 0.05 for 5%)</label>
                <input type="number" step="0.01" min="0" max="1" name="warning_band_percent" value="{{ settings.get('warning_band_percent', '0.05') }}" required>
            </div>
            
            <div class="form-group">
                <label>Session Lock Window (Hours)</label>
                <input type="number" name="session_lock_hours" value="{{ settings.get('session_lock_hours', '24') }}" required>
                <small style="color: var(--text-secondary); display: block; margin-top: 4px;">Time after which faculty cannot edit attendance without a correction request.</small>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Save Settings</button>
        </form>
    </div>
</div>
{% endblock %}
