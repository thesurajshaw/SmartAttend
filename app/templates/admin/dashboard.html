{% extends "base.html" %}
{% block title %}Admin Dashboard — SmartAttend{% endblock %}
{% block breadcrumb %}
    <span>Dashboard</span>
{% endblock %}

{% block content %}
<div class="card-grid">
    {% for label, count in stats %}
    <div class="card stat-card stat-card-wide">
        <h3 class="stat-label-lg">{{ label }}</h3>
        <p class="stat-value text-accent">{{ count }}</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
